name: Shakepay
description: >-
  Shakepay (Shake Labs Inc.) is a regulated Canadian cryptocurrency platform
  headquartered in Montreal, Quebec, serving 1,500,000+ Canadians with
  commission-free buying, selling, and on-chain movement of Bitcoin, Ethereum,
  and USDC via Interac e-Transfer. Beyond trading it offers a Visa prepaid card
  that earns up to 1.5% back in bitcoin (#shakepaid), recurring dollar-cost-
  averaging buys, interest paid weekly in bitcoin on CAD/USD balances, peer-to-
  peer transfers, bill pay, and the daily ShakingSats reward. Shakepay is a
  CIRO member, a registered Investment Dealer with the AMF, registered with
  securities regulators across all Canadian provinces/territories, and a FINTRAC
  money-services business. It does not currently publish a public developer API;
  it runs an experimental agent-access MCP surface (mcp.shakepay.com) alongside
  a public status page, security.txt bug-bounty program, and llms.txt reference.
